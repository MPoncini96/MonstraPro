# Installed to /etc/NetworkManager/dnsmasq-shared.d/monstra-setup.conf by
# image/scripts/install.sh. NetworkManager's "shared" connection method
# (what `nmcli device wifi hotspot` uses - see
# services/device_agent/src/device_agent/network.py's NetworkManagerClient)
# already runs a dnsmasq instance for the temporary access point; this file
# adds one DNS override so any phone joined to the AP resolves
# "setup.monstra" to the AP's own gateway address, where
# device_agent's setup_server.py is listening on port 80.
#
# 10.42.0.1 is NetworkManager's default shared-connection gateway address.
# If a real Pi 5 build ends up using a different subnet, update this file
# to match - image/README.md "What remains" flags this as unverified
# against real hardware.
address=/setup.monstra/10.42.0.1
