[alembic]
script_location = src/device_core/db/migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os

; Overridden programmatically by device_core.db.migrate for in-process
; callers, and by the MONSTRAPRO_SQLITE_URL env var (see migrations/env.py)
; for the bare `alembic` CLI. This value only matters if neither applies.
sqlalchemy.url = sqlite:///./.dev-data/monstrapro.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
