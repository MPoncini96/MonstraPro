[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "display"
version = "0.1.0"
description = "Monstra.Pro Box display service: always-on status renderer + event-driven state machine."
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
