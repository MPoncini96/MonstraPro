[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "updater"
version = "0.1.0"
description = "Monstra.Pro Box updater service: release manifest check, signature verification, release apply, health-check rollback."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
