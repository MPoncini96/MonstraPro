[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio_web"
version = "0.1.0"
description = "Monstra.Pro Box portfolio_web service: always-on, PIN-gated local page for toggling bots and managing locked individual-stock holdings."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
