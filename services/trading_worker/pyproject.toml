[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-worker"
version = "0.1.0"
description = "Monstra.Pro Box trading_worker service: activation state machine, scheduling loop, order execution against Alpaca."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.30",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
